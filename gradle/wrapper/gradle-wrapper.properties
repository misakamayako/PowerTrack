# 工具链锁定：Gradle 9.9.1 + AGP 9.4.1 + Kotlin 2.4.10（AGP 9 内置 Kotlin 支持，不再单独 apply kotlin-android）。
# 注意：AGP 8.x 与 Gradle 9.9+ 不兼容（embedded Kotlin 严格 pin annotations 13.0），
# 两个方向都不要单独降/升其中一边，见 settings.gradle.kts 顶部护栏。
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.9.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists